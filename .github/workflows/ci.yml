name: AcmeCloud CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acmecloud-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  validate:
    name: Validate Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required project files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "docker/web/Dockerfile"
            "docker/app/Dockerfile"
            "docker/compose.yml"
            "kubernetes/eks/namespace.yaml"
            "kubernetes/eks/web/deployment.yaml"
            "kubernetes/eks/web/service.yaml"
            "kubernetes/eks/app/deployment.yaml"
            "kubernetes/eks/app/service.yaml"
            "kubernetes/eks/ingress.yaml"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "ERROR: Required file not found: $file"
              exit 1
            fi

            echo "OK: $file"
          done

      - name: Validate Docker Compose configuration
        run: docker compose -f docker/compose.yml config --quiet

  docker-build:
    name: Validate Docker Builds
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build application image
        run: |
          docker build \
            -t acmecloud-app:ci \
            docker/app

      - name: Build web image
        run: |
          docker build \
            -t acmecloud-web:ci \
            docker/web

      - name: Display built images
        run: |
          docker image ls \
            --filter reference='acmecloud-*'


  kubernetes-validate:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yamllint
        run: python3 -m pip install --disable-pip-version-check yamllint

      - name: Validate Kubernetes YAML syntax
        shell: bash
        run: |
          set -euo pipefail

          echo "Validating AcmeCloud EKS manifests..."

          yamllint \
            -d '{extends: relaxed, rules: {line-length: disable}}' \
            kubernetes/eks/

          echo "Kubernetes YAML validation completed successfully."

      - name: Validate required Kubernetes fields
        shell: bash
        run: |
          set -euo pipefail

          for file in $(find kubernetes/eks -type f -name '*.yaml' | sort); do
            echo "Checking $file"

            grep -q '^apiVersion:' "$file" || {
              echo "ERROR: apiVersion missing from $file"
              exit 1
            }

            grep -q '^kind:' "$file" || {
              echo "ERROR: kind missing from $file"
              exit 1
            }

            grep -q '^metadata:' "$file" || {
              echo "ERROR: metadata missing from $file"
              exit 1
            }
          done

          echo "Required Kubernetes fields validated successfully."

  container-security:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs:
      - docker-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build application image
        run: |
          docker build \
            -t acmecloud-app:security-scan \
            docker/app

      - name: Build web image
        run: |
          docker build \
            -t acmecloud-web:security-scan \
            docker/web

      - name: Scan application image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: acmecloud-app:security-scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Scan web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: acmecloud-web:security-scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  aws-oidc-test:
    name: Test AWS OIDC Authentication
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::944777361548:role/acmecloud-production-github-actions
          aws-region: us-east-1

      - name: Verify AWS identity
        run: |
          echo "GitHub Actions successfully authenticated to AWS."
          aws sts get-caller-identity

  publish-ecr:
    name: Build and Push Images to ECR
    runs-on: ubuntu-latest

    needs:
      - docker-build
      - container-security

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "944777361548"
      APP_REPOSITORY: acmecloud-app
      WEB_REPOSITORY: acmecloud-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::944777361548:role/acmecloud-production-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image tag
        id: image-tag
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_TAG="${GITHUB_SHA::12}"

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing AcmeCloud images with tag: $IMAGE_TAG"

      - name: Build application image
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.image_tag }}
        run: |
          set -euo pipefail

          IMAGE="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$APP_REPOSITORY:$IMAGE_TAG"

          docker build \
            --tag "$IMAGE" \
            docker/app

      - name: Build web image
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.image_tag }}
        run: |
          set -euo pipefail

          IMAGE="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$WEB_REPOSITORY:$IMAGE_TAG"

          docker build \
            --tag "$IMAGE" \
            docker/web

      - name: Push application image
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.image_tag }}
        run: |
          set -euo pipefail

          IMAGE="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$APP_REPOSITORY:$IMAGE_TAG"

          docker push "$IMAGE"

      - name: Push web image
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.image_tag }}
        run: |
          set -euo pipefail

          IMAGE="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$WEB_REPOSITORY:$IMAGE_TAG"

          docker push "$IMAGE"

      - name: Publish image summary
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.image_tag }}
        run: |
          {
            echo "## AcmeCloud ECR Images"
            echo
            echo '```text'
            echo "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$APP_REPOSITORY:$IMAGE_TAG"
            echo "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$WEB_REPOSITORY:$IMAGE_TAG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
