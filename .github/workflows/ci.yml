name: AcmeCloud CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      deploy_to_eks:
        description: Deploy the release to the AcmeCloud EKS environment
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::944777361548:role/acmecloud-production-github-actions

concurrency:
  group: acmecloud-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  validate:
    name: Validate Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required project files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "docker/web/Dockerfile"
            "docker/app/Dockerfile"
            "docker/compose.yml"
            "kubernetes/eks/namespace.yaml"
            "kubernetes/eks/web/deployment.yaml"
            "kubernetes/eks/web/service.yaml"
            "kubernetes/eks/app/deployment.yaml"
            "kubernetes/eks/app/service.yaml"
            "kubernetes/eks/ingress.yaml"
            "monitoring/values.yaml"
            "monitoring/alerts/acmecloud-alerts.yaml"
            "monitoring/dashboards/acmecloud-overview.json"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "ERROR: Required file not found: $file"
              exit 1
            fi

            echo "OK: $file"
          done

      - name: Validate Docker Compose configuration
        run: docker compose -f docker/compose.yml config --quiet

  docker-build:
    name: Validate Docker Builds
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build application image
        run: |
          docker build \
            -t acmecloud-app:ci \
            docker/app

      - name: Build web image
        run: |
          docker build \
            -t acmecloud-web:ci \
            docker/web

      - name: Display built images
        run: |
          docker image ls \
            --filter reference='acmecloud-*'


  kubernetes-validate:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yamllint
        run: python3 -m pip install --disable-pip-version-check yamllint

      - name: Validate Kubernetes YAML syntax
        shell: bash
        run: |
          set -euo pipefail

          echo "Validating AcmeCloud EKS manifests..."

          yamllint \
            -d '{extends: relaxed, rules: {line-length: disable}}' \
            kubernetes/eks/

          echo "Kubernetes YAML validation completed successfully."

      - name: Validate monitoring configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "Validating monitoring YAML..."

          yamllint \
            -d '{extends: relaxed, rules: {line-length: disable}}' \
            monitoring/values.yaml \
            monitoring/alerts/acmecloud-alerts.yaml

          echo "Validating Grafana dashboard JSON..."

          python3 - <<'PYJSON'
          import json
          from pathlib import Path

          dashboard = Path("monitoring/dashboards/acmecloud-overview.json")

          with dashboard.open() as handle:
              json.load(handle)

          print(f"Valid JSON: {dashboard}")
          PYJSON

          echo "Monitoring configuration validation completed successfully."

      - name: Validate required Kubernetes fields
        shell: bash
        run: |
          set -euo pipefail

          for file in $(find kubernetes/eks -type f -name '*.yaml' | sort); do
            echo "Checking $file"

            grep -q '^apiVersion:' "$file" || {
              echo "ERROR: apiVersion missing from $file"
              exit 1
            }

            grep -q '^kind:' "$file" || {
              echo "ERROR: kind missing from $file"
              exit 1
            }

            grep -q '^metadata:' "$file" || {
              echo "ERROR: metadata missing from $file"
              exit 1
            }
          done

          echo "Required Kubernetes fields validated successfully."

  container-security:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs:
      - docker-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build application image
        run: |
          docker build \
            -t acmecloud-app:security-scan \
            docker/app

      - name: Build web image
        run: |
          docker build \
            -t acmecloud-web:security-scan \
            docker/web

      - name: Scan application image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: acmecloud-app:security-scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Scan web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: acmecloud-web:security-scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  aws-oidc-test:
    name: Test AWS OIDC Authentication
    runs-on: ubuntu-latest

    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.deploy_to_eks == true)

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          echo "GitHub Actions successfully authenticated to AWS."
          aws sts get-caller-identity

  publish-ecr:
    name: Build and Push Images to ECR
    runs-on: ubuntu-latest

    needs:
      - docker-build
      - container-security

    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.deploy_to_eks == true)

    permissions:
      contents: read
      id-token: write

    env:
      APP_REPOSITORY: acmecloud-app
      WEB_REPOSITORY: acmecloud-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve AWS account ID
        shell: bash
        run: |
          set -euo pipefail
          echo "AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image tag
        id: image-tag
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_TAG="${GITHUB_SHA::12}"

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing AcmeCloud images with tag: $IMAGE_TAG"

      - name: Build application image
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.image_tag }}
        run: |
          set -euo pipefail

          IMAGE="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$APP_REPOSITORY:$IMAGE_TAG"

          docker build \
            --tag "$IMAGE" \
            docker/app

      - name: Build web image
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.image_tag }}
        run: |
          set -euo pipefail

          IMAGE="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$WEB_REPOSITORY:$IMAGE_TAG"

          docker build \
            --tag "$IMAGE" \
            docker/web

      - name: Push application image
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.image_tag }}
        run: |
          set -euo pipefail

          IMAGE="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$APP_REPOSITORY:$IMAGE_TAG"

          docker push "$IMAGE"

      - name: Push web image
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.image_tag }}
        run: |
          set -euo pipefail

          IMAGE="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$WEB_REPOSITORY:$IMAGE_TAG"

          docker push "$IMAGE"

      - name: Publish image summary
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.image_tag }}
        run: |
          {
            echo "## AcmeCloud ECR Images"
            echo
            echo '```text'
            echo "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$APP_REPOSITORY:$IMAGE_TAG"
            echo "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$WEB_REPOSITORY:$IMAGE_TAG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-eks:
    name: Deploy to Amazon EKS
    runs-on: ubuntu-latest

    environment:
      name: production

    needs:
      - publish-ecr

    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_to_eks == true

    permissions:
      contents: read
      id-token: write

    env:
      EKS_CLUSTER_NAME: acmecloud-production-eks
      K8S_NAMESPACE: acmecloud
      APP_REPOSITORY: acmecloud-app
      WEB_REPOSITORY: acmecloud-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve AWS account ID
        shell: bash
        run: |
          set -euo pipefail
          echo "AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"

      - name: Configure EKS kubeconfig
        shell: bash
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Generate deployment image tag
        id: image-tag
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_TAG="${GITHUB_SHA::12}"

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying AcmeCloud release: $IMAGE_TAG"

      - name: Deploy Kubernetes resources
        shell: bash
        run: |
          set -euo pipefail

          kubectl apply -f kubernetes/eks/app/service.yaml
          kubectl apply -f kubernetes/eks/app/deployment.yaml
          kubectl apply -f kubernetes/eks/web/service.yaml
          kubectl apply -f kubernetes/eks/web/deployment.yaml

      - name: Deploy release images
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.image_tag }}
        run: |
          set -euo pipefail

          APP_IMAGE="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$APP_REPOSITORY:$IMAGE_TAG"
          WEB_IMAGE="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$WEB_REPOSITORY:$IMAGE_TAG"

          kubectl -n "$K8S_NAMESPACE" \
            set image deployment/acmecloud-app \
            app="$APP_IMAGE"

          kubectl -n "$K8S_NAMESPACE" \
            set image deployment/acmecloud-web \
            web="$WEB_IMAGE"

      - name: Verify deployment rollout
        id: verify-rollout
        shell: bash
        run: |
          set -euo pipefail

          kubectl -n "$K8S_NAMESPACE" \
            rollout status deployment/acmecloud-app \
            --timeout=5m

          kubectl -n "$K8S_NAMESPACE" \
            rollout status deployment/acmecloud-web \
            --timeout=5m

      - name: Roll back failed deployment
        if: failure() && steps.verify-rollout.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail

          echo "Deployment verification failed."
          echo "Rolling AcmeCloud back to the previous release..."

          kubectl -n "$K8S_NAMESPACE" \
            rollout undo deployment/acmecloud-app

          kubectl -n "$K8S_NAMESPACE" \
            rollout undo deployment/acmecloud-web

          echo
          echo "=== Verifying rollback ==="

          kubectl -n "$K8S_NAMESPACE" \
            rollout status deployment/acmecloud-app \
            --timeout=5m

          kubectl -n "$K8S_NAMESPACE" \
            rollout status deployment/acmecloud-web \
            --timeout=5m

          echo
          echo "=== Images after rollback ==="

          kubectl -n "$K8S_NAMESPACE" \
            get deployments \
            -o custom-columns='DEPLOYMENT:.metadata.name,IMAGE:.spec.template.spec.containers[*].image'

      - name: Verify deployed images
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Deployments ==="
          kubectl -n "$K8S_NAMESPACE" get deployments -o wide

          echo
          echo "=== Pods ==="
          kubectl -n "$K8S_NAMESPACE" get pods -o wide

          echo
          echo "=== Deployed Images ==="
          kubectl -n "$K8S_NAMESPACE" \
            get deployments \
            -o custom-columns='DEPLOYMENT:.metadata.name,IMAGE:.spec.template.spec.containers[*].image'

      - name: Publish deployment summary
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.image_tag }}
        run: |
          {
            echo "## AcmeCloud EKS Deployment"
            echo
            echo "- Cluster: \`$EKS_CLUSTER_NAME\`"
            echo "- Namespace: \`$K8S_NAMESPACE\`"
            echo "- Release: \`$IMAGE_TAG\`"
            echo "- App image: \`$APP_REPOSITORY:$IMAGE_TAG\`"
            echo "- Web image: \`$WEB_REPOSITORY:$IMAGE_TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"
