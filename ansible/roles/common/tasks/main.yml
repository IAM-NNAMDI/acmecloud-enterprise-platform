---
- name: Load OS-specific common variables
  ansible.builtin.include_vars:
    file: "{{ ansible_os_family }}.yml"

- name: Install common administration packages
  ansible.builtin.package:
    name: "{{ common_packages }}"
    state: present

- name: Ensure time synchronization service is enabled and running
  ansible.builtin.service:
    name: "{{ time_service }}"
    state: started
    enabled: true