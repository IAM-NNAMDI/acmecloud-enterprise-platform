---
tomcat_version: "10.1.46"
tomcat_major_version: "10"
tomcat_install_dir: "/opt/tomcat"
tomcat_user: "tomcat"
tomcat_group: "tomcat"

tomcat_archive: "apache-tomcat-{{ tomcat_version }}.tar.gz"

tomcat_download_url: >-
  https://archive.apache.org/dist/tomcat/tomcat-{{ tomcat_major_version }}/v{{ tomcat_version }}/bin/{{ tomcat_archive }}