apiVersion: apps/v1
kind: Deployment
metadata:
  name: acmecloud-web
  namespace: acmecloud
  labels:
    app: acmecloud-web
    app.kubernetes.io/name: acmecloud-web
    app.kubernetes.io/part-of: acmecloud-enterprise-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: acmecloud-web
  template:
    metadata:
      labels:
        app: acmecloud-web
        app.kubernetes.io/name: acmecloud-web
        app.kubernetes.io/part-of: acmecloud-enterprise-platform
    spec:
      imagePullSecrets:
        - name: ecr-registry
      containers:
        - name: web
          image: 944777361548.dkr.ecr.us-east-1.amazonaws.com/acmecloud-web:v5
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
