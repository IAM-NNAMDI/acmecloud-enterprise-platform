apiVersion: v1
kind: Service
metadata:
  name: acmecloud-web
  namespace: acmecloud
  labels:
    app: acmecloud-web
    app.kubernetes.io/name: acmecloud-web
    app.kubernetes.io/part-of: acmecloud-enterprise-platform
spec:
  type: NodePort
  selector:
    app: acmecloud-web
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30081
      protocol: TCP
