apiVersion: apps/v1
kind: Deployment
metadata:
  name: acmecloud-app
  namespace: acmecloud
  labels:
    app: acmecloud-app
    app.kubernetes.io/name: acmecloud-app
    app.kubernetes.io/part-of: acmecloud-enterprise-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: acmecloud-app
  template:
    metadata:
      labels:
        app: acmecloud-app
        app.kubernetes.io/name: acmecloud-app
        app.kubernetes.io/part-of: acmecloud-enterprise-platform
    spec:
      containers:
      - name: app
        image: 944777361548.dkr.ecr.us-east-1.amazonaws.com/acmecloud-app:v3
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
