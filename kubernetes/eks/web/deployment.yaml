apiVersion: apps/v1
kind: Deployment
metadata:
  name: acmecloud-web
  namespace: acmecloud
  labels:
    app: acmecloud-web
    app.kubernetes.io/name: acmecloud-web
    app.kubernetes.io/part-of: acmecloud-enterprise-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: acmecloud-web
  template:
    metadata:
      labels:
        app: acmecloud-web
        app.kubernetes.io/name: acmecloud-web
        app.kubernetes.io/part-of: acmecloud-enterprise-platform
    spec:
      containers:
      - name: web
        image: 944777361548.dkr.ecr.us-east-1.amazonaws.com/acmecloud-web:v5
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
